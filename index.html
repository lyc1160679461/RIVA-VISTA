<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
const { useState, useEffect, useRef } = React;

function Nav({ activeSection, onNavigate, isScrolled, navDark, logoImage }) {
  const navItems = [
    { id: 'overview', cn: '项目概览', en: 'Overview' },
    { id: 'location', cn: '地脉与区位', en: 'Location' },
    { id: 'residence', cn: '产品体验', en: 'Residence' },
    { id: 'culture', cn: '艺术风貌', en: 'Culture' },
    { id: 'gallery', cn: '视觉馆', en: 'Gallery' },
    { id: 'contact', cn: '联系我们', en: 'Contact' },
  ];
  return (
    <nav className={`nav ${isScrolled ? 'is-scrolled' : ''} ${navDark ? 'nav-dark' : ''}`}>
      <a className="nav-logo" href="#overview" onClick={(e) => { e.preventDefault(); onNavigate('overview'); }} aria-label="RIVA VISTA 望东潮 首页">
        <img src={logoImage} alt="RIVA VISTA 望东潮" />
      </a>
      <ul className="nav-links">
        {navItems.map((item) => (
          <li key={item.id}>
            <a href={`#${item.id}`} className={`nav-link ${activeSection === item.id ? 'is-active' : ''}`} onClick={(e) => { e.preventDefault(); onNavigate(item.id); }}>
              <span className="nav-link-en">{item.en}</span>
              {item.cn}
            </a>
          </li>
        ))}
      </ul>
    </nav>
  );
}

function Hero({ reliefImage, goldenImage, logoImage }) {
  const canvasRef = useRef(null);
  const heroRef = useRef(null);
  const mouseRef = useRef({ x: 0, y: 0, targetX: 0, targetY: 0, active: false, opacity: 0, radius: 0 });
  useEffect(() => {
    const canvas = canvasRef.current;
    const hero = heroRef.current;
    if (!canvas || !hero) return;
    const ctx = canvas.getContext('2d');
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let rafId = null;
    let startTime = performance.now();
    let goldenImg = null;
    let imgReady = false;
    let canvasW = 0, canvasH = 0, drawX = 0, drawY = 0, drawW = 0, drawH = 0;
    const resize = () => {
      const rect = hero.getBoundingClientRect();
      canvasW = rect.width; canvasH = rect.height;
      canvas.width = canvasW * dpr; canvas.height = canvasH * dpr;
      canvas.style.width = canvasW + 'px'; canvas.style.height = canvasH + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (imgReady && goldenImg) calcDrawRect();
    };
    const calcDrawRect = () => {
      const imgRatio = goldenImg.width / goldenImg.height;
      const canvasRatio = canvasW / canvasH;
      if (imgRatio > canvasRatio) { drawH = canvasH; drawW = drawH * imgRatio; drawX = (canvasW - drawW) / 2; drawY = 0; }
      else { drawW = canvasW; drawH = drawW / imgRatio; drawX = 0; drawY = (canvasH - drawH) / 2; }
    };
    resize();
    window.addEventListener('resize', resize);
    goldenImg = new Image();
    goldenImg.onload = () => { imgReady = true; calcDrawRect(); };
    goldenImg.onerror = () => { imgReady = false; };
    goldenImg.src = goldenImage;
    const getPos = (clientX, clientY) => { const rect = hero.getBoundingClientRect(); return { x: clientX - rect.left, y: clientY - rect.top }; };
    const handleMove = (clientX, clientY) => { const p = getPos(clientX, clientY); mouseRef.current.targetX = p.x; mouseRef.current.targetY = p.y; mouseRef.current.active = true; };
    const handleMouseMove = (e) => handleMove(e.clientX, e.clientY);
    const handleMouseEnter = (e) => { const p = getPos(e.clientX, e.clientY); mouseRef.current.x = p.x; mouseRef.current.y = p.y; mouseRef.current.targetX = p.x; mouseRef.current.targetY = p.y; mouseRef.current.active = true; };
    const handleMouseLeave = () => { mouseRef.current.active = false; };
    const handleTouchMove = (e) => { if (e.touches.length > 0) handleMove(e.touches[0].clientX, e.touches[0].clientY); };
    const handleTouchStart = (e) => { if (e.touches.length > 0) { const p = getPos(e.touches[0].clientX, e.touches[0].clientY); mouseRef.current.x = p.x; mouseRef.current.y = p.y; mouseRef.current.targetX = p.x; mouseRef.current.targetY = p.y; mouseRef.current.active = true; } };
    const handleTouchEnd = () => { mouseRef.current.active = false; };
    hero.addEventListener('mousemove', handleMouseMove);
    hero.addEventListener('mouseenter', handleMouseEnter);
    hero.addEventListener('mouseleave', handleMouseLeave);
    hero.addEventListener('touchmove', handleTouchMove, { passive: true });
    hero.addEventListener('touchstart', handleTouchStart, { passive: true });
    hero.addEventListener('touchend', handleTouchEnd);
    const animate = () => {
      try {
        const now = performance.now();
        const elapsed = (now - startTime) / 1000;
        const m = mouseRef.current;
        m.x += (m.targetX - m.x) * 0.1;
        m.y += (m.targetY - m.y) * 0.1;
        const targetOpacity = m.active ? 1 : 0;
        m.opacity += (targetOpacity - m.opacity) * 0.06;
        const baseR = Math.min(canvasW, canvasH) * 0.35;
        const breathR = baseR * (1 + Math.sin(elapsed * 0.8) * 0.05);
        m.radius += (breathR - m.radius) * 0.08;
        ctx.clearRect(0, 0, canvasW, canvasH);
        if (m.opacity > 0.01 && imgReady && goldenImg && goldenImg.complete && goldenImg.naturalWidth > 0) {
          const cx = m.x, cy = m.y, r = m.radius;
          ctx.save();
          ctx.globalAlpha = m.opacity;
          ctx.beginPath();
          const SEGMENTS = 120;
          for (let i = 0; i <= SEGMENTS; i++) {
            const angle = (i / SEGMENTS) * Math.PI * 2;
            const wave = Math.sin(angle * 6 + elapsed * 0.7) * r * 0.08 + Math.sin(angle * 10 + elapsed * 1.1 + 2.3) * r * 0.045 + Math.sin(angle * 4 + elapsed * 0.45 + 4.1) * r * 0.055 + Math.sin(angle * 13 + elapsed * 1.6 + 1.0) * r * 0.025;
            const edgeR = r + wave;
            const px = cx + Math.cos(angle) * edgeR;
            const py = cy + Math.sin(angle) * edgeR;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.clip();
          ctx.drawImage(goldenImg, drawX, drawY, drawW, drawH);
          ctx.globalCompositeOperation = 'destination-in';
          const grad = ctx.createRadialGradient(cx, cy, r * 0.4, cx, cy, r * 1.0);
          grad.addColorStop(0, 'rgba(0, 0, 0, 1)');
          grad.addColorStop(0.45, 'rgba(0, 0, 0, 0.9)');
          grad.addColorStop(0.75, 'rgba(0, 0, 0, 0.5)');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = grad;
          ctx.fillRect(cx - r * 1.2, cy - r * 1.2, r * 2.4, r * 2.4);
          ctx.restore();
        }
      } catch (e) { console.warn('[Hero canvas] animation error:', e); }
      rafId = requestAnimationFrame(animate);
    };
    rafId = requestAnimationFrame(animate);
    return () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener('resize', resize);
      hero.removeEventListener('mousemove', handleMouseMove);
      hero.removeEventListener('mouseenter', handleMouseEnter);
      hero.removeEventListener('mouseleave', handleMouseLeave);
      hero.removeEventListener('touchmove', handleTouchMove);
      hero.removeEventListener('touchstart', handleTouchStart);
      hero.removeEventListener('touchend', handleTouchEnd);
    };
  }, [goldenImage]);
  return (
    <section className="hero" id="overview" ref={heroRef}>
      <div className="hero-bg" style={{ backgroundImage: `url(${reliefImage})` }}></div>
      <canvas ref={canvasRef} className="hero-canvas-overlay" aria-hidden="true"></canvas>
      <div className="hero-vertical-text left">Shanghai · Yangpu · Riverside</div>
      <div className="hero-vertical-text right">Est. Badai · 八埭头地块</div>
      <div className="hero-content">
        <div className="hero-logo-wrap"><img src={logoImage} alt="RIVA VISTA 望东潮" className="hero-logo" /></div>
        <p className="hero-slogan-en">The first sight <em>of Shanghai</em></p>
      </div>
      <div className="hero-scroll-hint"><span>Scroll</span><div className="hero-scroll-line"></div></div>
    </section>
  );
}

const LIFESTYLE_ROW_1 = [
  { key: 'lifestyle1', title: '江畔晨光', en: 'Morning by the River' },
  { key: 'lifestyle2', title: '艺术厅堂', en: 'Artistic Living Hall' },
  { key: 'lifestyle3', title: '露台私宴', en: 'Terrace Dinner' },
  { key: 'lifestyle4', title: '书阁沉思', en: 'Library Contemplation' },
];
const LIFESTYLE_ROW_2 = [
  { key: 'lifestyle5', title: '泳池午后', en: 'Afternoon Poolside' },
  { key: 'lifestyle6', title: '城市黄昏', en: 'Urban Dusk' },
  { key: 'lifestyle7', title: '夜色奢享', en: 'Night Indulgence' },
  { key: 'lifestyle8', title: '江景书房', en: 'Riverview Study' },
];

function Overview({ images, onImageClick }) {
  const keywords = [
    { en: 'Heritage', cn: '风 貌', desc: '百年八埭头石库门里弄的城市肌理，在更新中保留历史温度，让海派文化与当代居住共生。' },
    { en: 'Modern', cn: '摩 登', desc: '立于滨江世界会客厅前沿，以国际化建筑语言与精奢生活方式，对话全球都会居住标准。' },
    { en: 'Living', cn: '生 活', desc: '精奢与烟火之间的从容尺度，在一线江景与里弄烟火的交融中，构筑有温度的高端生活。' },
  ];
  const allLifestyle = [...LIFESTYLE_ROW_1, ...LIFESTYLE_ROW_2];
  const handleImageClick = (e, key) => {
    e.stopPropagation();
    const items = allLifestyle.map((item) => ({ id: item.key, title: item.title, en: item.en, img: images[item.key], category: 'lifestyle' }));
    const index = items.findIndex((i) => i.id === key);
    onImageClick(items, index);
  };
  const renderRow = (rowData, direction, duration) => {
    const doubled = [...rowData, ...rowData];
    return (
      <div className={`lifestyle-row ${direction}`} style={{ '--marquee-duration': `${duration}s` }}>
        <div className="lifestyle-row-track">
          {doubled.map((item, i) => (
            <div className="lifestyle-row-item" key={`${item.key}-${i}`} onClick={(e) => handleImageClick(e, item.key)} role="button" tabIndex={0}>
              <img src={images[item.key]} alt={item.title} loading="lazy" decoding="async" />
            </div>
          ))}
        </div>
      </div>
    );
  };
  return (
    <>
      <section className="section" id="overview-story">
        <div className="story-grid reveal">
          <div className="story-image"><img src={images.shikumen} alt="八埭头石库门里弄" /></div>
          <div className="story-content">
            <div className="eyebrow-row"><span className="eyebrow">Heritage · 地脉溯源</span></div>
            <h3>百年八埭头<em>A Century of Badai Toutou</em></h3>
            <p>八埭头，始于二十世纪初的石库门里弄集群，是杨浦滨江最早的市民聚居地之一。八条石库门里弄依次排布，「八埭」之名由此而来。</p>
            <p>这里曾是沪东最繁华的商业中心，商铺林立、烟火蒸腾，承载着老上海的市井记忆与海派风骨。一个世纪后的今天，八埭头以崭新的面貌重回上海的世界舞台。</p>
          </div>
        </div>

function GalleryView({ isOpen, onClose, images, onImageClick }) {
  const [activeFilter, setActiveFilter] = useState('all');
  useEffect(() => {
    if (isOpen) { document.body.style.overflow = 'hidden'; document.body.classList.add('gallery-view-open'); setActiveFilter('all'); window.scrollTo({ top: 0, behavior: 'auto' }); }
    else { document.body.style.overflow = ''; document.body.classList.remove('gallery-view-open'); }
    return () => { document.body.style.overflow = ''; document.body.classList.remove('gallery-view-open'); };
  }, [isOpen]);
  useEffect(() => { if (!isOpen) return; const handleKey = (e) => { if (e.key === 'Escape') onClose(); }; window.addEventListener('keydown', handleKey); return () => window.removeEventListener('keydown', handleKey); }, [isOpen, onClose]);
  const getImgUrl = (imgKey) => images[imgKey] || images.arch1;
  const filteredItems = activeFilter === 'all' ? GALLERY_DATA : GALLERY_DATA.filter(item => item.category === activeFilter);
  const handleItemClick = (item) => { const itemsWithImages = filteredItems.map(i => ({ ...i, img: getImgUrl(i.imgKey) })); const currentIndex = itemsWithImages.findIndex(i => i.id === item.id); onImageClick(itemsWithImages, currentIndex); };
  if (!isOpen) return null;
  return (
    <div className={`gallery-view ${isOpen ? 'is-open' : ''}`}>
      <header className="gallery-view-header">
        <button className="gallery-view-back" onClick={onClose}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg><span>返回首页</span></button>
        <div className="gallery-view-title"><span className="gallery-view-title-cn">视觉馆</span><span className="gallery-view-title-en">GALLERY</span></div>
        <div style={{ width: '120px' }}></div>
      </header>
      <div className="gallery-view-filter">
        <ul>{GALLERY_FILTERS.map((f) => (<li key={f.key} className={activeFilter === f.key ? 'is-active' : ''} onClick={() => setActiveFilter(f.key)}>{f.label} <span>/ {f.en}</span></li>))}</ul>
      </div>
      <div className="gallery-view-masonry">
        <div className="masonry">{filteredItems.map((item) => (<div key={item.id} className="masonry-item" onClick={() => handleItemClick(item)}><img src={getImgUrl(item.imgKey)} alt={item.title} loading="lazy" /><div className="masonry-overlay"><div className="masonry-caption"><em>{item.en}</em>{item.title}</div></div></div>))}</div>
      </div>
    </div>
  );
}

function Lightbox({ isOpen, items, currentIndex, onClose, onPrev, onNext }) {
  useEffect(() => { const handleKeyDown = (e) => { if (!isOpen) return; if (e.key === 'Escape') onClose(); if (e.key === 'ArrowLeft') onPrev(); if (e.key === 'ArrowRight') onNext(); }; window.addEventListener('keydown', handleKeyDown); return () => window.removeEventListener('keydown', handleKeyDown); }, [isOpen, onClose, onPrev, onNext]);
  useEffect(() => { if (isOpen) { document.body.style.overflow = 'hidden'; } else { document.body.style.overflow = ''; } return () => { document.body.style.overflow = ''; }; }, [isOpen]);
  if (!items || items.length === 0) return null;
  const current = items[currentIndex] || items[0];
  const handleBackdropClick = (e) => { if (e.target === e.currentTarget) onClose(); };
  return (
    <div className={`lightbox ${isOpen ? 'is-open' : ''}`} onClick={handleBackdropClick} role="dialog" aria-modal="true">
      <button className="lightbox-close" onClick={onClose} aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" strokeLinecap="round" /></svg></button>
      <button className="lightbox-nav prev" onClick={onPrev} aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" strokeLinecap="round" strokeLinejoin="round" /></svg></button>
      <button className="lightbox-nav next" onClick={onNext} aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" strokeLinecap="round" strokeLinejoin="round" /></svg></button>
      <div className="lightbox-image-wrap"><img src={current.img} alt={current.title} /></div>
      <div className="lightbox-caption">{current.title}<em>{current.en} · {currentIndex + 1} / {items.length}</em></div>
    </div>
  );
}

function Contact() {
  const [formData, setFormData] = useState({ name: '', phone: '', email: '', message: '' });
  const [submitted, setSubmitted] = useState(false);
  const handleChange = (e) => { const { name, value } = e.target; setFormData((prev) => ({ ...prev, [name]: value })); };
  const handleSubmit = (e) => { e.preventDefault(); setSubmitted(true); setTimeout(() => setSubmitted(false), 3000); setFormData({ name: '', phone: '', email: '', message: '' }); };
  const details = [
    { label: 'Address', value: '上海市杨浦区八埭头滨江板块\n望东潮生活美学馆' },
    { label: 'Phone', value: '021 - 6888 8888' },
    { label: 'Email', value: 'rivavista@shanghai.com' },
    { label: 'Hours', value: '每日 10:00 — 20:00\n（需提前预约参观）' },
  ];
  return (
    <section className="contact-section" id="contact">
      <div className="contact-info reveal">
        <div className="eyebrow-row"><span className="eyebrow">Contact · 联系我们</span></div>
        <h2>预约<em>品鉴</em></h2>
        <p className="sub">望东潮生活美学馆 · 敬邀品鉴</p>
        <ul className="contact-details">{details.map((d) => (<li key={d.label}><span>{d.label}</span><span style={{ whiteSpace: 'pre-line' }}>{d.value}</span></li>))}</ul>
      </div>
      <div className="contact-form reveal reveal-delay-2">
        <form onSubmit={handleSubmit}>
          <div className="form-row">
            <div className="form-group"><label htmlFor="name">姓名 / Name</label><input type="text" id="name" name="name" value={formData.name} onChange={handleChange} required /></div>
            <div className="form-group"><label htmlFor="phone">电话 / Phone</label><input type="tel" id="phone" name="phone" value={formData.phone} onChange={handleChange} required /></div>
          </div>
          <div className="form-group"><label htmlFor="email">邮箱 / Email</label><input type="email" id="email" name="email" value={formData.email} onChange={handleChange} /></div>
          <div className="form-group"><label htmlFor="message">留言 / Message</label><textarea id="message" name="message" value={formData.message} onChange={handleChange} rows="3" placeholder="请告知您感兴趣的户型或其他需求..."></textarea></div>
          <button type="submit" className="form-submit">{submitted ? '提交成功 / Submitted' : '预约参观 / Book a Visit'}</button>
        </form>
      </div>
    </section>
  );
}

  const navLinks = [
    { id: 'overview', cn: '项目概览' }, { id: 'location', cn: '地脉与区位' }, { id: 'residence', cn: '产品体验' }, { id: 'culture', cn: '艺术风貌' }, { id: 'gallery', cn: '视觉馆' }, { id: 'contact', cn: '联系我们' },
  ];
  const services = ['预约参观', '户型咨询', '媒体合作', '人才招聘'];
  return (
    <footer className="footer">
      <div className="footer-inner">
        <div className="footer-top">
          <div className="footer-brand">
            <div className="footer-brand-logo"><img src={logoImage} alt="RIVA VISTA 望东潮" /></div>
            <p className="footer-brand-name">RIVA VISTA</p>
            <p className="footer-brand-name-cn">望 东 潮</p>

          </div>
          <div className="footer-col"><h5>Navigation</h5><ul>{navLinks.map((link) => (<li key={link.id}><a href={`#${link.id}`} onClick={(e) => handleClick(e, link.id)}>{link.cn}</a></li>))}</ul></div>
          <div className="footer-col"><h5>Services</h5><ul>{services.map((s) => (<li key={s}><a href="#contact" onClick={(e) => handleClick(e, 'contact')}>{s}</a></li>))}</ul></div>
          <div className="footer-col"><h5>Contact</h5><ul><li><a href="tel:02168888888">021 - 6888 8888</a></li><li><a href="mailto:rivavista@shanghai.com">rivavista@shanghai.com</a></li><li>上海市杨浦区八埭头</li><li>每日 10:00 — 20:00</li></ul></div>
        </div>
        <div className="footer-bottom"><span>© 2024 华润置地 · 望东潮 RIVA VISTA SHANGHAI. All rights reserved.</span><span>开发商：华润置地（上海）有限公司</span></div>
      </div>
    </footer>

  const [isScrolled, setIsScrolled] = useState(false);
  const [navDark, setNavDark] = useState(false);
  const [lightboxOpen, setLightboxOpen] = useState(false);
  const [lightboxItems, setLightboxItems] = useState([]);
  const [lightboxIndex, setLightboxIndex] = useState(0);
  const [galleryOpen, setGalleryOpen] = useState(false);
  const images = {
    logoVertical: 'assets/logo/logo-vertical-transparent.png',
    heroRelief: 'assets/images/hero-relief-dark.jpg',

    urban1: 'assets/gallery/urban1.jpg', urban2: 'assets/gallery/urban2.jpg', urban3: 'assets/gallery/urban3.jpg',
  };
  useEffect(() => {
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => { document.body.classList.add('fonts-loaded'); });
    } else { setTimeout(() => { document.body.classList.add('fonts-loaded'); }, 3000); }
  }, []);
  useEffect(() => {
    const sections = ['overview', 'overview-story', 'location', 'residence', 'culture', 'gallery', 'contact'];
    const sectionMap = { 'overview': 'overview', 'overview-story': 'overview', 'location': 'location', 'residence': 'residence', 'culture': 'culture', 'gallery': 'gallery', 'contact': 'contact' };
    const darkSections = ['overview', 'culture'];
    const handleScroll = () => {
      const scrollY = window.scrollY;
      setIsScrolled(scrollY > 80);
      const viewportMid = scrollY + window.innerHeight * 0.35;
      let currentId = 'overview'; let currentDark = false;
      for (const id of sections) { const el = document.getElementById(id); if (!el) continue; const top = el.offsetTop; if (viewportMid >= top) { currentId = id; if (darkSections.includes(id)) { const elBottom = top + el.offsetHeight; if (viewportMid < elBottom) currentDark = true; } else { currentDark = false; } } }
      setActiveSection(sectionMap[currentId] || 'overview');
      setNavDark(currentDark);
      const reveals = document.querySelectorAll('.reveal');
      reveals.forEach((el) => { const rect = el.getBoundingClientRect(); const triggerY = window.innerHeight * 0.88; if (rect.top < triggerY && rect.bottom > 0) { el.classList.add('is-visible'); } });
    };
    handleScroll();
    window.addEventListener('scroll', handleScroll, { passive: true });
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);
  const handleNavigate = (id) => { const el = document.getElementById(id); if (el) { const navHeight = 88; const top = el.offsetTop - navHeight + 1; window.scrollTo({ top, behavior: 'smooth' }); } };
  const handleGalleryOpen = () => setGalleryOpen(true);
  const handleGalleryClose = () => setGalleryOpen(false);
  const handleImageClick = (items, index) => { setLightboxItems(items); setLightboxIndex(index); setLightboxOpen(true); };
  const handleLightboxClose = () => setLightboxOpen(false);
  const handleLightboxPrev = () => { setLightboxIndex((p) => (p - 1 + lightboxItems.length) % lightboxItems.length); };
  const handleLightboxNext = () => { setLightboxIndex((p) => (p + 1) % lightboxItems.length); };
  return (
    <>
      <Nav activeSection={activeSection} onNavigate={handleNavigate} isScrolled={isScrolled} navDark={navDark} logoImage={images.logoVertical} />
      <main>
        <Hero reliefImage={images.heroRelief} goldenImage={images.heroGolden} logoImage={images.logoVertical} />
        <Overview images={images} onImageClick={handleImageClick} />
        <Location images={images} />
        <Residence images={images} />
        <Culture images={images} />
        <GalleryEntry images={images} onOpen={handleGalleryOpen} />
        <Contact />
      </main>
      <Footer onNavigate={handleNavigate} logoImage={images.logoVertical} />
      <GalleryView isOpen={galleryOpen} onClose={handleGalleryClose} images={images} onImageClick={handleImageClick} />
      <Lightbox isOpen={lightboxOpen} items={lightboxItems} currentIndex={lightboxIndex} onClose={handleLightboxClose} onPrev={handleLightboxPrev} onNext={handleLightboxNext} />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
